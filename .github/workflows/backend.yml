name: Backend CI/CD

on:
  push:
    branches: [main, develop, test/agentes]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend.yml'

env:
  GCP_REGION: us-west1

jobs:
  lint-test:
    name: Lint, Security & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest pytest-asyncio httpx pytest-cov safety

      - name: Lint (ruff)
        run: ruff check app/

      - name: Dependency vulnerability scan (safety)
        run: safety check -r requirements.txt --ignore 70612
        continue-on-error: false

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-fail-under=40
        env:
          CHAT_AUTH_REQUIRED: "false"
          GROQ_API_KEY: "test-placeholder"
          GCS_BUCKET_NAME: ""
          GOOGLE_APPLICATION_CREDENTIALS: ""

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: Backend/coverage.xml
          flags: backend
        continue-on-error: true

  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push'
    outputs:
      image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/enci-intel-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build & push
        run: |
          docker build \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/enci-intel-backend:${{ github.sha }} \
            -f Backend/Dockerfile Backend
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/enci-intel-backend:${{ github.sha }}

  scan-image:
    name: Scan Docker Image (Trivy)
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gcr.io/${{ secrets.GCP_PROJECT_ID }}/enci-intel-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

  deploy-test:
    name: Deploy → Test
    runs-on: ubuntu-latest
    needs: scan-image
    if: github.ref == 'refs/heads/develop'
    environment: test
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: enci-intel-backend-test
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/enci-intel-backend:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --memory=2Gi
            --allow-unauthenticated
            --set-env-vars=CHAT_AUTH_REQUIRED=true,GCS_BUCKET_NAME=enci-intel-rag
            --set-secrets=GROQ_API_KEY=GROQ_API_KEY:latest

  deploy-prod:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: scan-image
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: enci-intel-proyect-backend
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/enci-intel-backend:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --memory=2Gi
            --allow-unauthenticated
            --set-env-vars=CHAT_AUTH_REQUIRED=true,GCS_BUCKET_NAME=enci-intel-rag
            --set-secrets=GROQ_API_KEY=GROQ_API_KEY:latest
