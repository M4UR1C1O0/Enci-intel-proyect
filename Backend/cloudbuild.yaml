steps:
  # Paso 1: Build de la imagen Docker del backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/enci-intel-backend:$COMMIT_SHA'
      - '-f'
      - 'Backend/Dockerfile'
      - 'Backend'

  # Paso 2: Push de la imagen
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/enci-intel-backend:$COMMIT_SHA'

  # Paso 3: Deploy a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'enci-intel-proyect-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/enci-intel-backend:$COMMIT_SHA'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/enci-intel-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY